<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8b7cf6">
<title>자캐 아카이브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --theme:#8b7cf6; --on-theme:#fff; --soft:#f1effe; --soft2:#e2defd; --theme-text:#4a3fa0;
  --bg:#f7f6fb; --bg-blur:rgba(247,246,251,.86); --surface:#ffffff; --text:#1d1b26; --muted:#6b6880; --line:#e7e4ef;
  --radius:18px;
}
:root.dark{
  --bg:#14131a; --bg-blur:rgba(20,19,26,.86); --surface:#1e1c26; --text:#ecebf3; --muted:#9a97ad; --line:#2f2c3a;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.muted{color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:4px 0 10px}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));background:var(--bg-blur);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:18px;color:var(--theme-text);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;display:grid;place-items:center}
#app{max-width:960px;margin:0 auto;padding:16px 16px 90px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap;line-height:1.3}
.btn.primary{background:var(--theme);color:var(--on-theme);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:#e5484d;border-color:#f1c2c4;background:transparent}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.big{width:100%;padding:14px;font-size:16px}
.btn.add{width:100%;border-style:dashed;background:transparent;color:var(--theme-text);border-radius:14px;border-color:var(--soft2);border-width:2px;margin-top:4px}
.btn:disabled{opacity:.4}
.mini{padding:4px 10px;font-size:12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.mini.danger{color:#e5484d}
.mini:disabled{opacity:.35}
.toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.toolbar .spacer{flex:1}
.tb-title{font-size:15px}
.chip{padding:6px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600}
.chip.on{background:var(--theme);color:var(--on-theme);border-color:transparent}

/* inputs */
.input{width:100%;padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface);outline:none;font-size:15px;transition:border-color .15s}
.input:focus{border-color:var(--theme)}
textarea.input{resize:vertical;min-height:140px;line-height:1.7}
textarea.input.grow{min-height:0;resize:none;overflow:hidden;line-height:1.5;display:block}
.kv{align-items:start}
select.input{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:5px}
.check{display:flex;align-items:center;gap:8px;font-weight:600;margin:6px 0}
.check input{width:18px;height:18px;accent-color:var(--theme)}

/* list */
.list-head{display:flex;align-items:baseline;justify-content:space-between;margin:4px 2px 12px}
.list-head h1{margin:0;font-size:22px}
.search-row{display:flex;gap:8px}
.search-row .sort{width:auto;flex:none}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 16px}
.filters{margin:12px 0 16px;display:grid;gap:8px}
.filter-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.filter-row .chip{flex:none}
.filter-row .lbl{flex:none;font-size:12px;font-weight:700;color:var(--muted);align-self:center;margin-right:2px;min-width:30px}
.list-btns{display:flex;gap:6px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 16px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--theme);color:var(--on-theme)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;justify-content:center}
.meta span{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--soft2);color:var(--theme-text);background:var(--surface)}
@media(min-width:720px){.meta{justify-content:flex-start}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.char-card{background:var(--surface);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.char-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(0,0,0,.35)}
.char-card:active{transform:scale(.98)}
.thumb{aspect-ratio:1/1;background:var(--soft) center 20%/cover no-repeat;display:grid;place-items:center;font-size:42px;font-weight:800;color:var(--theme-text)}
.char-card .info{padding:10px 12px 12px;border-top:4px solid var(--theme)}
.char-card .info b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char-card .info span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.new-card{border:2px dashed var(--soft2);background:transparent;display:grid;place-items:center;min-height:200px;color:var(--theme-text);font-weight:700;text-align:center;line-height:1.5}
.new-card big{font-size:34px;font-weight:400}
.empty-box{text-align:center;padding:60px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty-emoji{font-size:44px;color:var(--theme)}
.banner{background:var(--soft);border-radius:14px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}

/* detail sheet */
.sheet{background:var(--bg);padding:18px;border-radius:24px}
.hero{display:grid;gap:22px}
.hero-img{max-width:340px;width:100%;margin:0 auto}
.hero-img img{width:100%;height:auto;display:block;border-radius:22px;box-shadow:0 14px 34px -16px var(--theme)}
.hero-info{text-align:center}
.sub{margin:0 0 2px;font-weight:700;color:var(--theme-text);font-size:14px}
.hero h1{margin:0;font-size:32px;line-height:1.25;letter-spacing:-.01em}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;justify-content:center}
.tag{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--soft2);color:var(--theme-text);font-weight:700}
.quote{margin:8px 0 4px;font-size:14px;color:var(--theme-text);font-weight:500;line-height:1.6;font-style:italic}
.profile{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;margin:14px 0 0;font-size:14px;background:var(--surface);padding:14px 18px;border-radius:16px;border:1px solid var(--line);text-align:left}
.profile dt{color:var(--theme-text);font-weight:700}
.profile dd{margin:0}
@media(min-width:720px){
  .hero{grid-template-columns:300px 1fr;align-items:start}
  .hero.noimg{grid-template-columns:1fr}
  .hero-info{text-align:left}
  .tags{justify-content:flex-start}
}
.sec{margin-top:30px}
.sec h2{font-size:18px;margin:0 0 12px;display:flex;align-items:center;gap:9px}
.bar{display:inline-block;width:6px;height:20px;border-radius:3px;background:var(--theme)}
.story{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;line-height:1.8;text-align:justify;word-break:break-all}
.rel-list{display:grid;gap:8px}
@media(min-width:620px){.rel-list{grid-template-columns:1fr 1fr}}
.rel{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.rel .txt{flex:1;min-width:0}
.rel b{display:block;line-height:1.35}
.rel span{font-size:13px;color:var(--muted);line-height:1.45;display:block}
.rel .go{color:var(--theme-text);font-size:20px;font-weight:700}
.avatar{width:50px;height:50px;border-radius:50%;flex:none;background:var(--soft) center 20%/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--theme-text);font-weight:800;font-size:18px}
.motif-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-items:start}
.motif{background:var(--surface);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.motif img{width:100%;height:auto;display:block}
.motif .mt{padding:10px 12px}
.motif b{display:block;line-height:1.35}
.motif p{margin:3px 0 0;font-size:13px;color:var(--muted);line-height:1.5}
.song{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.song-row{display:flex;align-items:center;gap:12px}
.disc{width:46px;height:46px;border-radius:50%;flex:none;background:var(--theme);color:var(--on-theme);display:flex;align-items:center;justify-content:center;font-size:20px}
.song .txt{flex:1;min-width:0}
.song b{display:block;line-height:1.35}
.song span{display:block;font-size:13px;color:var(--muted)}
.song p{margin:8px 2px 0;font-size:14px}
.song .listen{font-size:13px;font-weight:700;color:var(--theme-text);white-space:nowrap}
.yt{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:12px;margin-top:10px;background:#000}
.ward-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;align-items:start}
.ward img{width:100%;height:auto;display:block;border-radius:14px}
.ward p{font-size:13px;margin:6px 2px 0;color:var(--muted);line-height:1.45}
.danger-row{display:flex;justify-content:center;gap:8px;margin-top:26px}

/* edit */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.edit-tools{position:sticky;top:65px;z-index:10;background:var(--bg-blur);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:8px 0;margin-top:-8px}
.main-row{display:flex;gap:14px;align-items:flex-start;margin:10px 0 4px}
.main-row .main-fields{flex:1;min-width:0}
.item-edit{display:flex;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:var(--bg);flex-wrap:wrap}
.item-edit .fields{flex:1;min-width:170px;display:grid;gap:6px;align-content:start}
.item-edit .two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.item-tools{display:flex;gap:4px;width:100%;justify-content:flex-end}
.img-slot{width:84px;flex:none;border-radius:12px;border:2px dashed var(--soft2);background:var(--soft) center 20%/cover no-repeat;color:var(--theme-text);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;text-align:center}
.img-slot.r1{aspect-ratio:1/1}
.img-slot.r34{aspect-ratio:3/4}
.img-slot.big{width:118px}
.img-slot.has{border-style:solid;border-color:transparent}
.img-slot.linked{cursor:default;font-size:24px}
.img-x{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);background:#2b2935;color:#fff;font-size:12px;display:grid;place-items:center;padding:0}
.kv{display:grid;grid-template-columns:minmax(80px,30%) 1fr auto;gap:6px;margin-bottom:6px;align-items:center}
.color-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
input[type=color]{width:46px;height:46px;border:1px solid var(--line);padding:3px;background:var(--surface);border-radius:12px;cursor:pointer}
.save-bottom{margin-top:18px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,8,20,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100;animation:fade .15s}
.modal{position:relative;background:var(--surface);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px;padding-bottom:max(20px,env(safe-area-inset-bottom));animation:up .2s ease-out}
@media(min-width:600px){.modal-bg{align-items:center}.modal{border-radius:24px}}
.modal h3{margin:0 0 12px;font-size:19px;padding-right:36px}
.modal-x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:0;background:var(--bg);font-size:15px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.btn-col{display:grid;gap:8px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--text)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;min-height:160px;height:180px;line-height:1.4}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:.5}}

/* cropper */
.crop-stage{position:relative;overflow:hidden;margin:14px auto 10px;border-radius:12px;background:#111;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.crop-stage:active{cursor:grabbing}
.crop-stage img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;pointer-events:none;user-select:none;-webkit-user-drag:none}
.crop-stage::before,.crop-stage::after{content:"";position:absolute;pointer-events:none;z-index:1}
.crop-stage::before{top:0;bottom:0;left:33.333%;right:33.333%;border-left:1px solid rgba(255,255,255,.45);border-right:1px solid rgba(255,255,255,.45)}
.crop-stage::after{left:0;right:0;top:33.333%;bottom:33.333%;border-top:1px solid rgba(255,255,255,.45);border-bottom:1px solid rgba(255,255,255,.45)}
.zoom-row{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--muted)}
.zoom-row input{flex:1;accent-color:var(--theme)}
.png-preview{width:100%;border-radius:12px;border:1px solid var(--line);display:block;max-height:55vh;object-fit:contain;background:var(--bg)}

/* group png (rendered offscreen) */
.group-cap{position:absolute;left:-99999px;top:0;background:var(--bg);padding:48px 40px 44px;font-family:inherit}
.gc-head{text-align:center;margin-bottom:28px}
.gc-title{font-size:38px;font-weight:800;color:var(--theme-text);line-height:1.3}
.gc-sub{font-size:18px;color:var(--muted);margin-top:4px}
.gc-grid{display:grid;gap:18px}
.gc-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.gc-thumb{height:0;padding-top:100%;position:relative;background:var(--soft) center 20%/cover no-repeat}
.gc-thumb span{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:800;color:var(--theme-text)}
.gc-info{padding:12px 14px 14px;border-top:5px solid var(--theme);text-align:center}
.gc-info b{display:block;font-size:20px;line-height:1.35}
.gc-info span{display:block;font-size:14px;color:var(--muted);line-height:1.4;margin-top:2px}
/* 시기 */
.era-strip{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 12px;margin-bottom:4px;scrollbar-width:none}
.era-strip::-webkit-scrollbar{display:none}
.era-btn{flex:none;min-width:84px;max-width:120px;border:0;background:transparent;padding:0;text-align:center;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.era-btn b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.era-thumb{display:flex;align-items:center;justify-content:center;width:84px;height:84px;border-radius:18px;background:var(--soft) center 20%/cover no-repeat;border:3px solid transparent;font-weight:800;color:var(--theme-text);font-size:22px;box-sizing:border-box}
.era-thumb{background-origin:border-box}
.era-btn.on .era-thumb{border-color:var(--theme)}
.era-btn b{display:block;font-size:13px;margin-top:4px;line-height:1.3}
.era-btn.on b{color:var(--theme-text)}
.era-btn small{display:block;font-size:11px;color:var(--muted)}
.part-lbl{display:inline-block;font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--soft2);color:var(--theme-text);margin:0 0 6px}
.part-lbl.era{background:var(--theme);color:var(--on-theme)}
.story + .part-lbl,.deeds + .part-lbl{margin-top:14px}
.deeds{margin:0;padding:12px 18px 12px 38px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.deeds li{margin:3px 0}
.profile dd.chg{font-weight:700;color:var(--theme-text)}
.meta span.era-badge{background:var(--theme);color:var(--on-theme);border-color:transparent}
.cmp-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.cmp{border-collapse:collapse;width:100%;font-size:14px;background:var(--surface)}
.cmp th,.cmp td{padding:10px 12px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);vertical-align:top;text-align:left;line-height:1.55}
.cmp td{min-width:170px}
.cmp tr > :first-child{border-left:0}
.cmp tbody th{color:var(--theme-text);font-weight:700;background:var(--soft);font-size:13px;min-width:84px}
.cmp thead th{background:var(--theme);color:var(--on-theme);font-weight:800;font-size:15px}
.cmp tr.grp th{background:var(--soft2);color:var(--theme-text);font-size:12px;padding:5px 12px}
.cmp tr.img td img{width:100%;max-width:200px;height:auto;display:block;border-radius:12px}
.cmp ol{margin:0;padding-left:18px}
.cmp .dash{color:var(--muted)}
.cmp tbody tr:last-child > *{border-bottom:0}
.png-box{position:absolute;left:-99999px;top:0;background:var(--bg);padding:28px 24px;font-family:inherit}
.png-box .sheet{padding:0}
.png-box .png-cmp{margin-top:8px}
.png-box .sheet + .png-cmp{margin-top:34px}
.png-box .cmp{border:1px solid var(--line)}
.png-box .cmp td{width:250px;min-width:0}
.png-box .cmp tbody th{width:140px}
.pc-head{text-align:center;margin-bottom:18px}
.pc-name{font-size:30px;font-weight:800;line-height:1.3}
.pc-sub{color:var(--theme-text);font-weight:700}
.pc-h2{font-size:18px;margin:0 0 12px;display:flex;align-items:center;gap:9px}
/* 시기 편집 */
.era-edit{border:2px solid var(--soft2);border-radius:16px;padding:12px;margin-bottom:10px;background:var(--bg)}
.era-top{display:flex;gap:10px;flex-wrap:wrap}
.era-top .fields{flex:1;min-width:170px;display:grid;gap:6px;align-content:start}
.sub-h{font-size:13px;font-weight:800;color:var(--theme-text);margin:12px 0 6px}
.sub-h small{font-weight:600;color:var(--muted);margin-left:4px}
.kv.deed{grid-template-columns:20px 1fr auto}
.deed-n{font-size:13px;font-weight:800;color:var(--muted);text-align:center}
.deed-tools{display:flex;gap:3px}
.deed-tools .mini{padding:4px 7px}
.era-rel{display:grid;gap:6px}
.era-rel .sub-h{margin:6px 0 0}
.era-rel-row{display:grid;grid-template-columns:minmax(64px,28%) 1fr;gap:6px;align-items:center;font-size:13px;font-weight:700;color:var(--theme-text)}
.check.sm{font-size:13px;margin:2px 0}
.check.sm input{width:16px;height:16px}
/* 3:4 고정 사진 (PNG 저장에서도 같은 모양이 나오도록 배경 이미지로 그림) */
.pic34{width:100%;height:0;padding-top:133.333%;background:var(--soft) center 20%/cover no-repeat;border-radius:16px}
.hero-img .pic34{border-radius:22px}
.motif .pic34{border-radius:0}
.ward .pic34{border-radius:14px}

/* 행적 타임라인 */
.tl{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px 4px}
.tl-row{position:relative;padding:0 0 10px 26px;line-height:1.55}

.tl-node{position:absolute;left:1px;top:7px;width:10px;height:10px;box-sizing:border-box;border-radius:50%;background:var(--surface);border:2px solid var(--theme);z-index:1}
.tl-node.big{left:-1px;top:4px;width:14px;height:14px;border:0;background:var(--theme)}
.tl-chip{display:inline-block;font-size:12px;font-weight:800;padding:1px 10px;border-radius:999px;background:var(--theme);color:var(--on-theme);line-height:1.6}

.dots .dot-item{display:flex;gap:8px;margin:2px 0}
.dots .dot{flex:none;width:6px;height:6px;border-radius:50%;background:var(--theme);margin-top:9px}
/* 시기 패널 */
.era-panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.era-panel .story{padding:12px 14px;background:var(--bg)}
.era-head{display:flex;gap:14px;align-items:center}

/* 행적 편집 */
.deed-edit{display:grid;grid-template-columns:1fr auto;grid-template-areas:"txt tools";gap:6px;margin-bottom:8px;align-items:center}
.deed-edit.with-era{grid-template-columns:minmax(90px,40%) 1fr;grid-template-areas:"sel tools" "txt txt";padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.deed-sel{grid-area:sel;padding:7px 30px 7px 10px;font-size:14px}
.deed-txt{grid-area:txt}
.deed-edit .deed-tools{grid-area:tools;justify-self:end}
/* 순서 바꾸기 */
.ro-list{display:grid;gap:6px}

.ro-thumb{width:40px;height:40px;border-radius:10px;flex:none;background:var(--soft) center 20%/cover no-repeat;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--theme-text)}
.ro-name{flex:1;min-width:0;line-height:1.3}
.ro-name b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ro-name small{color:var(--muted);font-size:12px}
.ro-row .mini{padding:6px 10px;font-size:14px}
/* 2칸 프로필 상자 */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:14px}
.pbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;line-height:1.45;min-width:0}

/* 나무위키식 시기 비교 */
.nm{border-collapse:collapse;table-layout:fixed;font-size:14px;background:var(--surface)}

.nm-era{font-size:13px;font-weight:700;opacity:.85}
.nm .nm-pic td{padding:0;border-left:2px solid var(--surface);border-top:0;border-bottom:0}

.nm-pic .pic34.empty{background:var(--soft)}
.nm tr:not(.nm-head):not(.nm-pic) th{width:86px;background:var(--theme);color:var(--on-theme);font-size:13px;font-weight:700;text-align:center;padding:8px 6px;border-color:var(--soft2)}
.nm tr:not(.nm-head):not(.nm-pic) th:not(:first-child){border-left:2px solid var(--surface)}
.nm td{padding:8px 10px;text-align:left}
.nm-head th:first-child,.nm-pic td:first-child{border-left-color:var(--theme)}
.cmp-scroll{border:0;background:transparent;border-radius:0}
/* 비교표: 달라진 칸 색칠, 같은 칸 흐리게 */
.nm td.same{color:var(--muted)}
.nm td.chg{background:var(--soft2);color:var(--text);border-left:3px solid var(--theme)}
.lg-chg{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--soft2);margin:0 4px 0 6px;vertical-align:-1px}
.pic34{position:relative}
.pic34.empty span{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;font-weight:700}
/* 시기 순서 */
.era-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.era-bar b{font-size:14px;color:var(--theme-text)}
.era-move{display:flex;gap:4px}
/* 목록 사진 위치 */
.thumb-adj{display:flex;gap:12px;align-items:center}
.thumb-prev{width:96px;height:96px;flex:none;border-radius:14px;background:var(--soft) center 20%/cover no-repeat;touch-action:none;cursor:ns-resize;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);border:1px solid var(--line)}

.c2 thead th{text-align:center;padding:14px 10px 12px;border-bottom:1px solid var(--line);vertical-align:bottom}
.c2 thead th b{display:block;font-size:16px;margin-top:5px;line-height:1.3}
.c2-chip{display:inline-block;font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--theme);color:var(--on-theme);white-space:nowrap}
.c2 tbody th{position:sticky;left:0;z-index:1;background:var(--surface);color:var(--theme-text);font-size:13px;font-weight:700;white-space:nowrap;width:84px;border-right:1px solid var(--line)}

.c2 td{min-width:150px}

.c2 .mark{display:inline-block;background:var(--soft2);color:var(--text);border-radius:10px;padding:1px 9px;margin-left:-4px}
.c2-pic td{text-align:center}
.c2-img{width:112px;margin:0 auto}
.c2-img .pic34{border-radius:14px}
.c2-grp th{background:var(--bg) !important;padding:6px 12px !important;border-right:0 !important}
.c2-grp th span{display:inline-block;font-size:12px;font-weight:800;color:var(--theme-text);background:var(--soft);padding:1px 10px;border-radius:999px}
.png-box .c2-wrap{overflow:hidden}
.png-box .c2 tbody th{position:static}

.kv-tools{display:flex;gap:3px}
.kv-tools .mini{padding:4px 7px}
.motif-thumb{width:48px;height:64px;flex:none;border-radius:10px;background:var(--soft) center 20%/cover no-repeat;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--theme-text);font-size:18px}
.motif-row small{display:block;font-size:12px;font-weight:700;color:var(--theme-text);line-height:1.3}
.era-rel-row{grid-template-columns:minmax(56px,max-content) 40px 1fr !important}
.er-img{position:relative;width:40px;height:40px;border-radius:50%;border:2px dashed var(--soft2);background:var(--soft) center 20%/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--theme-text);font-weight:700;cursor:pointer}
.er-img.has{border:0}
.era-rel-row .input{font-weight:400;color:var(--text);min-width:0}
.er-img .img-x{width:20px;height:20px;top:-6px;right:-6px;font-size:10px}
.sync-btn{margin-top:10px;width:100%}
.sync-pick{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.sync-pick small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 여러 칸 골라서 순서 바꾸기 */
.drag-h{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;width:34px;height:34px;flex:none;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:20px;line-height:1;padding:0;touch-action:none;cursor:grab;display:inline-flex;align-items:center;justify-content:center}
.drag-h:active{cursor:grabbing;background:var(--soft)}
.dragging{position:relative;z-index:20;box-shadow:0 14px 30px -12px rgba(0,0,0,.45);background:var(--surface);border-radius:12px;transition:none !important}
.drag-shift{transition:transform .15s ease}
.sel-btn{width:30px;height:30px;flex:none;border-radius:50%;border:2px solid var(--soft2);background:var(--surface);color:var(--on-theme);font-size:14px;font-weight:800;padding:0;display:inline-flex;align-items:center;justify-content:center}
.sel-btn.on{background:var(--theme);border-color:var(--theme)}
.picked{outline:2px solid var(--theme);outline-offset:1px;border-radius:12px}
.kv-tools,.deed-tools,.item-tools{align-items:center}
.sel-bar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom));z-index:5;display:flex;align-items:center;gap:6px;margin:8px 0;padding:8px 10px;border-radius:999px;background:var(--text);color:var(--surface);box-shadow:0 8px 24px -10px rgba(0,0,0,.5)}
.sel-bar span{font-size:13px;font-weight:700;flex:1;padding-left:6px}
.sel-bar button{border:0;background:rgba(255,255,255,.14);color:inherit;width:38px;height:34px;border-radius:999px;font-size:16px}
.sel-bar .sel-done{width:auto;padding:0 14px;font-size:13px;font-weight:700;background:var(--theme);color:var(--on-theme)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:#1d1b26;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;transition:.2s;z-index:300;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>

<body>
<header class="topbar">
  <a href="#/" class="brand" id="brand">자캐 아카이브</a>
  <button class="icon-btn" id="settingsBtn" aria-label="설정">⚙︎</button>
</header>
<main id="app"></main>
<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ---------- utils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl = s => esc(s).replace(/\n/g, '<br>');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => (typeof structuredClone === 'function' ? structuredClone(o) : JSON.parse(JSON.stringify(o)));
const isHex = v => typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v);
const safeImg = s => (typeof s === 'string' && (/^data:image\/[a-z0-9.+-]+;base64,[a-z0-9+/=\s]+$/i.test(s) || /^https?:\/\/[^\s'"()<>]+$/i.test(s))) ? s : '';
const safeUrl = s => (typeof s === 'string' && /^https?:\/\/[^\s"'<>]+$/i.test(s.trim())) ? s.trim() : '';
const bgImg = src => src ? `background-image:url('${src}')` : '';
const fmtSize = n => n < 1048576 ? Math.max(1, Math.round(n / 1024)) + 'KB' : (n / 1048576).toFixed(1) + 'MB';
const fmtDate = t => { const d = new Date(t); return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`; };
const ytId = u => { const m = String(u || '').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/); return m ? m[1] : ''; };

function hexToRgb(h){ h = h.replace('#',''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgbToHex(r,g,b){ return '#' + [r,g,b].map(v => Math.round(v).toString(16).padStart(2,'0')).join(''); }
function mix(a, b, t){ const A = hexToRgb(a), B = hexToRgb(b); return rgbToHex(...A.map((v,i) => v*t + B[i]*(1-t))); }
function luminance(h){ const [r,g,b] = hexToRgb(h).map(v => { v /= 255; return v <= .03928 ? v/12.92 : ((v+.055)/1.055) ** 2.4; }); return .2126*r + .7152*g + .0722*b; }
const onColor = h => luminance(h) > .42 ? '#1d1b26' : '#ffffff';
function themeVars(color, dark){
  const surface = dark ? '#1e1c26' : '#ffffff';
  return {
    '--theme': color, '--on-theme': onColor(color),
    '--soft': mix(color, surface, dark ? .2 : .12),
    '--soft2': mix(color, surface, dark ? .35 : .26),
    '--theme-text': dark ? mix(color, '#ffffff', .7) : mix(color, '#000000', luminance(color) > .4 ? .55 : .8)
  };
}
function applyVars(el, color){ const v = themeVars(color, state.settings.dark); for (const k in v) el.style.setProperty(k, v[k]); }

function toast(msg, ms = 2000){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms); }
function download(blob, name){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
function setPath(obj, path, val){ const k = path.split('.'); let o = obj; for (let i = 0; i < k.length - 1; i++) o = o[k[i]]; o[k[k.length-1]] = val; }
function pickFile(accept){
  // 모바일(특히 iOS)에서 화면에 붙어 있지 않은 input은 선택 후 이벤트가 사라질 수 있어서 문서에 붙여두고 씀
  return new Promise(res => {
    const old = document.getElementById('filePick'); if (old) old.remove();
    const i = document.createElement('input');
    i.type = 'file'; i.accept = accept; i.id = 'filePick';
    i.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0';
    document.body.append(i);
    let settled = false;
    const done = f => { if (settled) return; settled = true; setTimeout(() => i.remove(), 1000); res(f); };
    i.addEventListener('change', () => done((i.files && i.files[0]) || null));
    i.addEventListener('cancel', () => done(null));
    i.click();
  });
}

/* ---------- storage (IndexedDB, localStorage fallback) ---------- */
const DB = {
  db: null, fallback: false,
  open(){ return new Promise((res, rej) => { const r = indexedDB.open('oc-archive', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => rej(r.error); }); },
  get(k){ if (this.fallback) return Promise.resolve(JSON.parse(localStorage.getItem('oc-' + k) || 'null'));
    return new Promise((res, rej) => { const q = this.db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  set(k, v){ if (this.fallback){ localStorage.setItem('oc-' + k, JSON.stringify(v)); return Promise.resolve(); }
    return new Promise((res, rej) => { const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
};

/* ---------- state ---------- */
const DEFAULT = { version: 1, settings: { title: '나의 자캐 아카이브', theme: '#8b7cf6', dark: false, sort: 'manual', lastBackup: 0 }, characters: [] };
let state = clone(DEFAULT);
let saveTimer = null;
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(flush, 250); }
async function flush(){ clearTimeout(saveTimer); saveTimer = null; try { await DB.set('state', state); } catch (e) { toast('저장 실패: 저장 공간이 부족할 수 있어요. 백업 후 사진을 줄여 주세요.', 4000); console.error(e); } }
document.addEventListener('visibilitychange', () => { if (document.hidden && saveTimer) flush(); });

function blankChar(){
  return { id: uid(), kind: 'oc', origin: '', name: '', subtitle: '', image: '', color: '', tags: [],
    profile: [{k:'나이',v:''},{k:'키',v:''},{k:'생일',v:''}],
    quote: '', story: '', deeds: [], eras: [], mainEra: '', thumbY: 20,
    relations: [], motifs: [], songs: [], wardrobe: [], created: Date.now(), updated: Date.now() };
}
function normalizeChar(c){
  const b = blankChar(); c = (c && typeof c === 'object') ? c : {};
  const str = v => typeof v === 'string' ? v : (v == null ? '' : String(v));
  const isObj = x => x && typeof x === 'object';
  const arr = (v, f) => Array.isArray(v) ? v.filter(isObj).map(f) : [];
  const sid = v => (typeof v === 'string' && /^[\w-]{1,40}$/.test(v)) ? v : uid();
  const prof = v => arr(v, p => ({ k: str(p.k), v: str(p.v) }));
  const byEra = v => isObj(v) && !Array.isArray(v) ? Object.fromEntries(Object.entries(v).filter(([k]) => /^[\w-]{1,40}$/.test(k)).map(([k, x]) => [k, str(x)])) : {};
  const erasRaw = Array.isArray(c.eras) ? c.eras.filter(isObj) : [];
  const eras = erasRaw.map(e => ({ id: sid(e.id), label: str(e.label), name: str(e.name), au: !!e.au, image: safeImg(e.image), subtitle: str(e.subtitle), story: str(e.story), profile: prof(e.profile) }));
  const ids = new Set(eras.map(e => e.id));
  // 행적은 캐릭터 하나에 한 줄로 모아두고, 각 행적에 시기를 표시 (예전 버전의 시기별 행적은 여기로 옮김)
  const deedsOf = (v, eraId) => arr(v, d => ({ id: sid(d.id), text: str(d.text), eraId: str(d.eraId ?? eraId) }));
  let deeds = deedsOf(c.deeds, '');
  erasRaw.forEach((e, i) => { if (Array.isArray(e.deeds)) deeds = deeds.concat(deedsOf(e.deeds, eras[i].id)); });
  deeds.forEach(d => { if (!ids.has(d.eraId)) d.eraId = ''; });
  return {
    id: str(c.id) || b.id, kind: c.kind === 'canon' ? 'canon' : 'oc', origin: str(c.origin).trim(), name: str(c.name), subtitle: str(c.subtitle), image: safeImg(c.image),
    color: isHex(c.color) ? c.color : '', tags: Array.isArray(c.tags) ? c.tags.map(str).filter(Boolean) : [],
    profile: Array.isArray(c.profile) ? prof(c.profile) : b.profile,
    quote: str(c.quote), story: str(c.story), deeds, eras, mainEra: ids.has(c.mainEra) ? c.mainEra : '',
    relations: arr(c.relations, r => ({ id: str(r.id) || uid(), targetId: str(r.targetId), name: str(r.name), image: safeImg(r.image), relation: str(r.relation), byEra: byEra(r.byEra),
      byEraImg: isObj(r.byEraImg) && !Array.isArray(r.byEraImg) ? Object.fromEntries(Object.entries(r.byEraImg).filter(([k, v]) => /^[\w-]{1,40}$/.test(k) && safeImg(v)).map(([k, v]) => [k, safeImg(v)])) : {} })),
    motifs: arr(c.motifs, m => ({ id: str(m.id) || uid(), work: str(m.work), name: str(m.name), image: safeImg(m.image), reason: str(m.reason) })),
    songs: arr(c.songs, s => ({ id: str(s.id) || uid(), title: str(s.title), artist: str(s.artist), url: str(s.url), note: str(s.note) })),
    wardrobe: arr(c.wardrobe, w => ({ id: str(w.id) || uid(), image: safeImg(w.image), caption: str(w.caption) })),
    thumbY: Number.isFinite(+c.thumbY) && c.thumbY !== '' && c.thumbY != null ? Math.max(0, Math.min(100, +c.thumbY)) : 20,

function normalizeState(s){

  const out = { version: 1, settings: { ...d.settings, ...(s.settings || {}) }, characters: (Array.isArray(s.characters) ? s.characters : []).map(normalizeChar) };
  if (!isHex(out.settings.theme)) out.settings.theme = d.settings.theme;
  out.settings.title = String(out.settings.title || d.settings.title);
  return out;
}
const getChar = id => state.characters.find(c => c.id === id);
const KIND = { oc: '자캐', canon: '원작캐' };
const NO_ORIGIN = '__none';
const allOrigins = () => [...new Set(state.characters.map(c => c.origin.trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ko'));
// 같은 원작(세계관) 캐릭터들이 쓰는 프로필 항목 이름 (등장 순서 유지)
function originKeys(origin, excludeId){
  origin = origin.trim(); if (!origin) return [];
  const keys = [];
  state.characters.filter(c => c.id !== excludeId && c.origin.trim() === origin)
    .forEach(c => c.profile.forEach(p => { const k = p.k.trim(); if (k && !keys.includes(k)) keys.push(k); }));
  return keys;
}
function addMissingKeys(profile, keys){
  const have = new Set(profile.map(p => p.k.trim()).filter(Boolean)); let n = 0;
  keys.forEach(k => { if (!have.has(k)){ profile.push({ k, v: '' }); have.add(k); n++; } });
  return n;
}
const colorOf = c => (c && isHex(c.color)) ? c.color : state.settings.theme;
function sortedChars(){
  const a = [...state.characters], s = state.settings.sort;
  if (s === 'name') a.sort((x, y) => x.name.localeCompare(y.name, 'ko'));
  else if (s === 'created') a.sort((x, y) => x.created - y.created);
  else if (s === 'updated') a.sort((x, y) => y.updated - x.updated);
  return a;
}

function applyTheme(){
  const s = state.settings;
  document.documentElement.classList.toggle('dark', !!s.dark);
  applyVars(document.documentElement, s.theme);
  $('meta[name=theme-color]').content = s.dark ? '#14131a' : s.theme;

/* ---------- router ---------- */
const app = $('#app');
const ui = { q: '', tag: '', kind: '', origin: '', cid: null, eraSel: {} };
let draft = null, dirty = false, isNew = false, suppress = false, currentHash = location.hash;

function route(){
  const p = (location.hash.slice(1) || '/').split('/').filter(Boolean).map(decodeURIComponent);
  ui.cid = null;
  if (p[0] === 'c' && p[1]) return renderDetail(p[1]);
  if (p[0] === 'e' && p[1]) return renderEdit(p[1]);
  if (p[0] === 'new') return renderEdit(null);
  renderList();
}
window.addEventListener('hashchange', () => {
  if (suppress){ suppress = false; return; }
  if (draft && dirty && !confirm('저장하지 않은 변경사항이 있어요. 나갈까요?')){ suppress = true; location.hash = currentHash; return; }
  draft = null; dirty = false; currentHash = location.hash;
  route(); window.scrollTo(0, 0);
});
window.addEventListener('beforeunload', e => { if (draft && dirty){ e.preventDefault(); e.returnValue = ''; } });

/* ---------- list ---------- */
function renderList(){
  const s = state.settings;

  const needBackup = state.characters.length > 0 && (days === null || days >= 14);
  app.innerHTML = `
    ${needBackup ? `<div class="banner"><span>${days === null ? '아직 백업한 적이 없어요.' : `마지막 백업이 ${days}일 전이에요.`} 브라우저 데이터는 지워질 수 있으니 가끔 백업해 주세요.</span><button class="btn primary sm" data-act="backup">백업</button></div>` : ''}
    ${state.characters.length ? `<div class="list-head"><h1>캐릭터 목록 <span class="muted" style="font-size:14px;font-weight:600">${state.characters.length}명</span></h1><div class="list-btns"><button class="btn sm" data-act="list-html">HTML 추출</button><button class="btn sm" data-act="group-png">단체 PNG</button></div></div>
    <div class="search-row">
      <input class="input" type="search" id="q" placeholder="이름 · 원작 · 소개 · 태그 검색" value="${esc(ui.q)}">
      <select class="input sort" id="sort"><option value="manual">사용자 설정순</option><option value="created">등록순</option><option value="name">이름순</option><option value="updated">최근 수정순</option></select>
      <button class="icon-btn" data-act="reorder" aria-label="순서 바꾸기" title="순서 바꾸기">↕</button>
    </div>
    <div class="filters" id="filters"></div>` : ''}
    <div id="grid"></div>`;
  if (state.characters.length){
    $('#sort').value = s.sort || 'manual';
    $('#q').oninput = e => { ui.q = e.target.value; drawGrid(); };
    $('#sort').onchange = e => { s.sort = e.target.value; save(); drawGrid(); };

}
function drawFilters(){
  const cs = state.characters;
  const origins = allOrigins(), hasNone = cs.some(c => !c.origin.trim()), hasCanon = cs.some(c => c.kind === 'canon');
  const tags = [...new Set(cs.flatMap(c => c.tags))].sort((a, b) => a.localeCompare(b, 'ko'));
  if (ui.tag && !tags.includes(ui.tag)) ui.tag = '';
  if (ui.origin && ui.origin !== NO_ORIGIN && !origins.includes(ui.origin)) ui.origin = '';
  if (!hasCanon) ui.kind = '';
  const chip = (k, v, label) => `<button class="chip ${ui[k] === v ? 'on' : ''}" data-act="filter" data-k="${k}" data-v="${esc(v)}">${label}</button>`;
  const row = (lbl, chips) => `<div class="filter-row"><span class="lbl">${lbl}</span>${chips.join('')}</div>`;
  let h = '';
  if (hasCanon) h += row('구분', [chip('kind', '', '전체'), chip('kind', 'oc', '자캐'), chip('kind', 'canon', '원작캐')]);
  if (origins.length) h += row('원작', [chip('origin', '', '전체'), ...origins.map(o => chip('origin', o, esc(o))), ...(hasNone ? [chip('origin', NO_ORIGIN, '1차 창작')] : [])]);
  if (tags.length) h += row('태그', [chip('tag', '', '전체'), ...tags.map(t => chip('tag', t, '#' + esc(t)))]);
  $('#filters').innerHTML = h;
}
function filteredChars(){
  const q = ui.q.trim().toLowerCase();
  return sortedChars().filter(c =>
    (!ui.tag || c.tags.includes(ui.tag)) &&
    (!ui.kind || c.kind === ui.kind) &&
    (!ui.origin || (ui.origin === NO_ORIGIN ? !c.origin.trim() : c.origin.trim() === ui.origin)) &&
    (!q || [c.name, c.origin, c.subtitle, ...c.tags].join(' ').toLowerCase().includes(q)));
}
const filterLabel = () => [ui.kind ? KIND[ui.kind] : '', ui.origin ? (ui.origin === NO_ORIGIN ? '1차 창작' : ui.origin) : '', ui.tag ? '#' + ui.tag : ''].filter(Boolean).join(' · ');
function drawGrid(){
  const g = $('#grid');

    g.className = '';
    g.innerHTML = `<div class="empty-box"><div class="empty-emoji">✦</div><p>아직 등록된 캐릭터가 없어요.<br>첫 번째 아이를 소개해 주세요!</p>
      <a class="btn primary" href="#/new">+ 새 캐릭터 만들기</a><button class="btn ghost" data-act="import">백업 파일 불러오기</button></div>`;

        <div class="thumb" style="${thumbBg(c)}">${repImage(c) ? '' : esc((c.name || '?').slice(0, 1))}</div>
        <div class="info" style="border-top-color:${colorOf(c)}"><b>${esc(c.name || '이름 없음')}</b><span>${esc([c.origin, c.subtitle].filter(Boolean).join(' · ')) || '&nbsp;'}</span></div></a>`).join('')

/* ---------- 시기(버전) helpers ---------- */
const eraOf = (c, id) => id ? c.eras.find(e => e.id === id) : null;
// 목록·단체 PNG에 쓰는 대표 사진: 대표 시기 사진 → 공통 사진 → 사진 있는 첫 시기
function repImage(c){ const m = eraOf(c, c.mainEra); return (m && m.image) || c.image || (c.eras.find(e => e.image) || {}).image || ''; }
// 공통 프로필 + 시기에서 바뀐 값만 덮어쓰기
function mergedProfile(c, era){
  const ov = new Map();
  (era ? era.profile : []).forEach(p => { const k = p.k.trim(); if (k && p.v.trim()) ov.set(k, p.v); });
  const out = [], seen = new Set();
  c.profile.forEach(p => { const k = p.k.trim(); if (!k || seen.has(k)) return; seen.add(k); const v = ov.has(k) ? ov.get(k) : p.v; if (v.trim()) out.push({ k, v, changed: ov.has(k) }); });
  ov.forEach((v, k) => { if (!seen.has(k)) out.push({ k, v, changed: true }); });
  return out;
}
const relText = (r, era) => ((era && r.byEra[era.id]) || '').trim() || r.relation.trim();
const hasEraRel = r => Object.values(r.byEra).some(v => String(v).trim());
// era가 있으면 그 시기에 따로 적은 관계, 없으면 공통 관계
function relList(c, era){
  return c.relations.filter(r => r.targetId || r.name.trim() || r.relation.trim() || hasEraRel(r))
    .map(r => ({ r, text: era ? (r.byEra[era.id] || '').trim() : r.relation.trim(), img: era ? r.byEraImg[era.id] || '' : '' }))
    .filter(({ r, text }) => era ? !!text : (!!text || !hasEraRel(r)));
}
const liveDeeds = a => a.filter(d => d.text.trim());
const eraDeeds = (c, e) => liveDeeds(c.deeds).filter(d => d.eraId === e.id);
// 1:1 목록 사진: 대표 사진 + 사용자가 맞춘 세로 위치
const thumbBg = c => { const src = repImage(c); return src ? `background-image:url('${src}');background-position:center ${c.thumbY ?? 20}%` : ''; };
const pic = (src, cls = '') => `<div class="pic34 ${cls}" style="${bgImg(src)}"></div>`;
const dotList = a => `<div class="dots">${a.map(d => `<div class="dot-item"><span class="dot"></span><span>${nl(d.text)}</span></div>`).join('')}</div>`;
// 행적 타임라인: 같은 시기가 이어지는 부분끼리 묶고, 시기가 바뀔 때마다 시기 이름을 표시
function timelineHtml(c, deeds, chips){
  const rows = [];
  let cur = null;
  deeds.forEach(d => {
    if (chips && d.eraId !== cur){
      cur = d.eraId; const e = eraOf(c, d.eraId);
      rows.push(`<div class="tl-row head"><span class="tl-line"></span><span class="tl-node big"></span><span class="tl-chip ${e ? '' : 'plain'}">${e ? esc(e.label) : '원작'}</span></div>`);
    }
    rows.push(`<div class="tl-row"><span class="tl-line"></span><span class="tl-node"></span><span>${nl(d.text)}</span></div>`);
  });
  if (rows.length){
    rows[0] = rows[0].replace('class="tl-row', 'class="tl-row first');
    rows[rows.length - 1] = rows[rows.length - 1].replace('class="tl-row', 'class="tl-row last');
  }
  return `<div class="tl">${rows.join('')}</div>`;
}
// 원래 흐름(공통 + AU가 아닌 시기)과 AU별 행적을 나눔
function deedGroups(c){
  const all = liveDeeds(c.deeds), isAu = id => { const e = eraOf(c, id); return !!(e && e.au); };
  return {
    main: all.filter(d => !isAu(d.eraId)),
    aus: c.eras.filter(e => e.au).map(e => ({ era: e, deeds: all.filter(d => d.eraId === e.id) })).filter(g => g.deeds.length)
  };
}
function deedsSection(c){
  const { main, aus } = deedGroups(c), hasEras = c.eras.length > 0;
  if (!main.length && !aus.length) return '';
  const chips = c.eras.some(e => !e.au);
  return sec(hasEras ? '행적 <small>전체 흐름</small>' : '행적',
    (main.length ? timelineHtml(c, main, chips) : '')
    + aus.map(g => `<div class="au-block"><div class="au-h"><span class="tl-chip au">AU</span><b>${esc(g.era.label)}</b></div>${timelineHtml(c, g.deeds, false)}</div>`).join(''));
}
// 2칸 프로필 상자 (길면 한 줄 전체 사용)
const pgrid = list => `<dl class="plist">${list.map(p => `<div class="prow"><dt>${esc(p.k)}</dt><dd>${nl(p.v)}</dd></div>`).join('')}</dl>`;
// 시기 비교: 줄 = 항목, 칸 = [기본(원작) + 시기들]. 값은 모두 채우고, 기본과 달라진 값만 둥근 표시로 강조.
function compareTable(c){
  const cols = [{ name: c.name, label: c.kind === 'canon' ? '원작' : '기본', image: c.image, sub: c.subtitle.trim(), prof: mergedProfile(c, null), story: c.story.trim(), rel: r => r.relation.trim() }]
    .concat(c.eras.map(e => ({ name: e.name.trim() || c.name, label: (e.au ? 'AU · ' : '') + esc(e.label) + (e.id === c.mainEra ? ' ★' : ''), image: e.image,
      sub: e.subtitle.trim() || c.subtitle.trim(), prof: mergedProfile(c, e), story: e.story.trim(), rel: r => (r.byEra[e.id] || '').trim() })));
  const n = cols.length, out = [];
  const row = (label, vals, plain) => out.push(`<tr><th>${label}</th>${vals.map((v, j) => {
    if (!v) return '<td class="same"></td>';
    if (j === 0 || plain) return `<td>${v}</td>`;
    return v === vals[0] ? `<td class="same">${v}</td>` : `<td class="chg"><span class="mark">${v}</span></td>`;
  }).join('')}</tr>`);
  const group = t => out.push(`<tr class="c2-grp"><th colspan="${n + 1}"><span>${t}</span></th></tr>`);
  if (cols.some(x => x.name !== c.name)) row('이름', cols.map(x => esc(x.name)));
  if (cols.some(x => x.sub)) row('한 줄 소개', cols.map(x => esc(x.sub)));
  const keys = [];
  cols.forEach(x => x.prof.forEach(p => { if (!keys.includes(p.k)) keys.push(p.k); }));
  if (keys.length){ group('프로필'); keys.forEach(k => row(esc(k), cols.map(x => { const p = x.prof.find(q => q.k === k); return p ? nl(p.v) : ''; }))); }
  const rels = c.relations.filter(hasEraRel);
  if (rels.length){ group('인간관계'); rels.forEach(r => row(esc(relInfo(r).name || '관계'), cols.map(x => esc(x.rel(r))))); }
  if (cols.some(x => x.story)) row('상세', cols.map(x => x.story ? nl(x.story) : ''), true);
  return `<div class="c2-wrap"><table class="c2">
    <thead><tr><th class="corner"></th>${cols.map(x => `<th><span class="c2-chip">${x.label}</span><b>${esc(x.name)}</b></th>`).join('')}</tr></thead>
    <tbody><tr class="c2-pic"><th>사진</th>${cols.map(x => `<td><div class="c2-img">${x.image ? pic(x.image) : '<div class="pic34 empty"><span>사진 추가 예정</span></div>'}</div></td>`).join('')}</tr>
    ${out.join('')}</tbody></table></div>`;
}
/* ---------- detail ---------- */
const sec = (title, body, cls = '') => `<section class="sec ${cls}"><h2><span class="bar"></span>${title}</h2>${body}</section>`;
function relInfo(r){
  const target = r.targetId ? getChar(r.targetId) : null;
  return { target, name: target ? target.name : r.name, image: (target ? repImage(target) : '') || r.image, pos: target && repImage(target) ? target.thumbY : 20 };
}
function relCards(items, link){

      <div class="txt"><b>${esc(name || '이름 없음')}</b><span>${esc(text)}</span></div>`;
    return target && link ? `<a class="rel" href="#/c/${encodeURIComponent(target.id)}">${inner}<span class="go">›</span></a>` : `<div class="rel">${inner}</div>`;

}
// 공통 사항 부분들. live = 화면용(링크·유튜브 재생 포함), false = PNG용
function commonParts(c, live){
  const hasEras = c.eras.length > 0, img = repImage(c), prof = mergedProfile(c, null), rels = relList(c, null);
  const oc = c.kind !== 'canon';
  const motifs = oc ? c.motifs.filter(m => m.name.trim() || m.work.trim() || m.image || m.reason.trim()) : [];
  const songs = oc ? c.songs.filter(s => s.title.trim() || s.url.trim()) : [];

  return {
    hero: `<header class="hero ${img ? '' : 'noimg'}">
      ${img ? `<div class="hero-img">${pic(img)}</div>` : ''}

        <div class="meta"><span>${KIND[c.kind]}</span>${c.origin ? `<span>${esc(c.origin)}</span>` : ''}</div>
        ${c.subtitle ? `<p class="sub">${esc(c.subtitle)}</p>` : ''}

        <div class="motif-thumb" style="${bgImg(m.image)}">${m.image ? '' : esc((m.name || m.work || '?').slice(0, 1))}</div>
        <div class="txt">${m.work.trim() ? `<small>${esc(m.work)}</small>` : ''}<b>${esc(m.name || m.work)}</b>${m.reason.trim() ? `<span>${esc(m.reason)}</span>` : ''}</div></div>`).join('')}</div>`) : '')
      + (songs.length ? sec('테마곡', songs.map(s => {

          <div class="txt"><b>${esc(s.title || '제목 없음')}</b>${s.artist.trim() ? `<span>${esc(s.artist)}</span>` : ''}</div>
          ${url ? `<a class="listen" href="${esc(url)}" target="_blank" rel="noopener">듣기 ↗</a>` : ''}</div>
          ${s.note.trim() ? `<p>${esc(s.note)}</p>` : ''}
          ${yt && live ? `<iframe class="yt no-capture" src="https://www.youtube.com/embed/${yt}" loading="lazy" allow="encrypted-media; picture-in-picture" allowfullscreen></iframe>` : ''}</div>`;
      }).join('')) : '')
      + (ward.length ? sec('옷장', `<div class="ward-grid">${ward.map(w => `<div class="ward">${w.image ? pic(w.image) : ''}${w.caption.trim() ? `<p>${esc(w.caption)}</p>` : ''}</div>`).join('')}</div>`) : '')
  };
}
// PNG(공통 사항)용 시트
function commonSheet(c){ const p = commonParts(c, false); return p.hero + p.story + p.deeds + p.rels + p.extras; }
// 시기 탭 아래 패널: 이 시기에만 해당하는 것
function eraPanel(c, e){

function moveSel(path, how){
  const a = getArr(path), S = pickSet(path);
  if (how === 'up') for (let i = 1; i < a.length; i++){ if (S.has(a[i]) && !S.has(a[i - 1])) [a[i - 1], a[i]] = [a[i], a[i - 1]]; }
  if (how === 'down') for (let i = a.length - 2; i >= 0; i--){ if (S.has(a[i]) && !S.has(a[i + 1])) [a[i], a[i + 1]] = [a[i + 1], a[i]]; }
  if (how === 'top' || how === 'bottom'){ const x = a.filter(v => S.has(v)), y = a.filter(v => !S.has(v)); a.splice(0, a.length, ...(how === 'top' ? x.concat(y) : y.concat(x))); }
}

function drawThumbPrev(){
  const el = $('#thumbPrev'); if (!el || !draft) return;
  const src = repImage(draft);

}
function setupThumbAdj(){
  const el = $('#thumbPrev'), range = $('#thumbY');
  const set = v => { draft.thumbY = Math.round(Math.max(0, Math.min(100, v))); range.value = draft.thumbY; dirty = true; drawThumbPrev(); };
  range.oninput = () => set(+range.value);
  let startY = null, startV = 0;
  el.addEventListener('pointerdown', e => { if (!repImage(draft)) return; el.setPointerCapture(e.pointerId); startY = e.clientY; startV = draft.thumbY; });
  el.addEventListener('pointermove', e => {
    if (startY === null) return;
    // 3:4 사진을 1:1 칸에 넣으면 위아래로 (너비/3)만큼 남음 → 끈 거리만큼 위치(%) 이동
    const overflow = el.clientWidth / 3 || 1;
    set(startV - (e.clientY - startY) / overflow * 100);
  });
  const end = () => { startY = null; };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  drawThumbPrev();
}

/* ---------- 끌어서 순서 바꾸기 ---------- */
app.addEventListener('pointerdown', e => {
  const h = e.target.closest('[data-drag]'); if (!h || !draft) return;
  e.preventDefault();
  const path = h.dataset.drag, from = +h.dataset.i;
  const row = h.closest('.kv, .deed-edit, .item-edit'); if (!row) return;
  const list = row.parentElement;
  const rows = [...list.children].filter(el => el.matches('.kv, .deed-edit, .item-edit'));
  if (rows.length < 2) return;
  const sy0 = window.scrollY;
  const rects = rows.map(r => { const b = r.getBoundingClientRect(); return { top: b.top + sy0, h: b.height }; });
  const gap = rects.length > 1 ? Math.max(0, rects[1].top - (rects[0].top + rects[0].h)) : 8;
  const shift = rects[from].h + gap;
  let lastY = e.clientY, to = from, raf = 0, done = false;
  const startPageY = e.clientY + sy0;
  row.classList.add('dragging');
  rows.forEach(r => { if (r !== row) r.classList.add('drag-shift'); });
  try { h.setPointerCapture(e.pointerId); } catch {}
  const update = () => {
    const dy = lastY + window.scrollY - startPageY;
    row.style.transform = `translateY(${dy}px)`;
    const mid = rects[from].top + rects[from].h / 2 + dy;
    to = 0;
    rects.forEach((r, j) => { if (j !== from && r.top + r.h / 2 < mid) to++; });
    rows.forEach((r, j) => {
      if (j === from) return;
      let t = 0;
      if (to > from && j > from && j <= to) t = -shift;
      if (to < from && j >= to && j < from) t = shift;
      r.style.transform = t ? `translateY(${t}px)` : '';
    });
  };
  // 화면 위/아래 끝 근처에서는 자동으로 스크롤
  const tick = () => {
    if (done) return;
    const edge = 70;
    if (lastY < edge) { window.scrollBy(0, -8); update(); }
    else if (lastY > window.innerHeight - edge) { window.scrollBy(0, 8); update(); }
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
  const move = ev => { lastY = ev.clientY; update(); };
  const end = () => {
    done = true; cancelAnimationFrame(raf);
    h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', end); h.removeEventListener('pointercancel', end);
    rows.forEach(r => { r.style.transform = ''; r.classList.remove('drag-shift', 'dragging'); });
    if (to !== from){
      const a = getArr(path), [it] = a.splice(from, 1); a.splice(to, 0, it);
      dirty = true; rerender(path);
    }
  };
  h.addEventListener('pointermove', move); h.addEventListener('pointerup', end); h.addEventListener('pointercancel', end);
});

function openModal(html, onClose){

  wrap.innerHTML = `<div class="modal" role="dialog"><button class="modal-x" data-x="close" aria-label="닫기">✕</button>${html}</div>`;

  const close = () => { if (closed) return; closed = true; wrap.remove(); if (!$('#modal-root').children.length) document.body.style.overflow = ''; onClose && onClose(); };
  wrap.addEventListener('pointerdown', e => { wrap._down = e.target === wrap; });
  wrap.addEventListener('click', e => { if (e.target === wrap && wrap._down) close(); if (e.target.closest('[data-x="close"]')) close(); });
  return { el: wrap.firstElementChild, close };
}

/* ---------- image cropper (항상 3:4) ---------- */
let picking = false;
function loadImageFile(f){
  // 1차: blob URL, 실패하면 2차: FileReader(dataURL)로 다시 시도
  return new Promise(res => {
    const url = URL.createObjectURL(f), im = new Image();
    im.onload = () => res({ img: im, done: () => URL.revokeObjectURL(url) });
    im.onerror = () => {
      URL.revokeObjectURL(url);
      const fr = new FileReader();
      fr.onload = () => { const im2 = new Image(); im2.onload = () => res({ img: im2, done: () => {} }); im2.onerror = () => res(null); im2.src = fr.result; };
      fr.onerror = () => res(null);
      fr.readAsDataURL(f);
    };
    im.src = url;
  });
}
async function pickImage(){
  if (picking) return null;
  picking = true;
  try {
    const f = await pickFile('image/*'); if (!f) return null;
    toast('사진 불러오는 중…', 6000);
    const loaded = await loadImageFile(f);
    if (!loaded || !loaded.img.naturalWidth){
      toast(/heic|heif/i.test(f.type + f.name) ? 'HEIC 사진은 이 브라우저에서 열 수 없어요. JPG나 스크린샷으로 올려 주세요.' : '이 사진을 읽을 수 없어요. 다른 사진으로 시도해 주세요.', 4000);
      return null;
    }
    $('#toast').classList.remove('show');
    const out = await openCropper(loaded.img, /png|webp|gif/.test(f.type));
    loaded.done(); return out;
  } finally { picking = false; }
}
function openCropper(img, transparent){
  return new Promise(resolve => {
    let result = null;
    const m = openModal(`<h3>사진 자르기 <small class="muted" style="font-size:13px">3:4</small></h3>
      <div class="crop-stage"><img draggable="false" alt=""></div>
      <div class="zoom-row"><span>−</span><input type="range" min="1" max="5" step="0.01" value="1" aria-label="확대"><span>＋</span></div>
      <p class="hint" style="text-align:center">드래그로 위치 이동 · 슬라이더 / 두 손가락 / 휠로 확대</p>
      <div class="modal-actions"><button class="btn ghost" data-x="close">취소</button><button class="btn primary" data-ok>완료</button></div>`, () => resolve(result));
    const stage = $('.crop-stage', m.el), im = $('img', stage), slider = $('input[type=range]', m.el);
    im.src = img.src;
    const nw = img.naturalWidth, nh = img.naturalHeight, RW = 3, RH = 4;
    let W = 0, H = 0, base, zoom = 1, scale, x = 0, y = 0;
    function setup(){
      const avail = Math.max(200, (stage.parentElement.clientWidth || 320) - 40), maxH = window.innerHeight * .55;
      W = Math.min(avail, 360); H = W * RH / RW; if (H > maxH){ H = maxH; W = H * RW / RH; }
      stage.style.width = W + 'px'; stage.style.height = H + 'px';
      base = Math.max(W / nw, H / nh); zoom = 1; slider.value = 1; scale = base;
      x = (W - nw * scale) / 2; y = (H - nh * scale) / 2; apply();
    }
    function apply(){
      const dw = nw * scale, dh = nh * scale;
      x = Math.min(0, Math.max(W - dw, x)); y = Math.min(0, Math.max(H - dh, y));
      im.style.width = dw + 'px'; im.style.height = dh + 'px'; im.style.transform = `translate(${x}px,${y}px)`;
    }
    function zoomTo(z, cx = W / 2, cy = H / 2){
      z = Math.max(1, Math.min(5, z)); const ns = base * z;
      const px = (cx - x) / scale, py = (cy - y) / scale;
      scale = ns; zoom = z; x = cx - px * ns; y = cy - py * ns; slider.value = z; apply();
    }
    const pts = new Map(); let lastDist = 0;
    const pinch = () => { const [a, b] = [...pts.values()]; return [Math.hypot(a.x - b.x, a.y - b.y), { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }]; };
    stage.addEventListener('pointerdown', e => { stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (pts.size === 2) lastDist = pinch()[0]; });
    stage.addEventListener('pointermove', e => {
      const p = pts.get(e.pointerId); if (!p) return;
      if (pts.size === 1){ x += e.clientX - p.x; y += e.clientY - p.y; p.x = e.clientX; p.y = e.clientY; apply(); }
      else { p.x = e.clientX; p.y = e.clientY; const [d, mid] = pinch(), r = stage.getBoundingClientRect(); if (lastDist) zoomTo(zoom * d / lastDist, mid.x - r.left, mid.y - r.top); lastDist = d; }
    });
    const up = e => { pts.delete(e.pointerId); lastDist = pts.size === 2 ? pinch()[0] : 0; };
    stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
    stage.addEventListener('wheel', e => { e.preventDefault(); const r = stage.getBoundingClientRect(); zoomTo(zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
    slider.addEventListener('input', () => zoomTo(+slider.value));
    $('[data-ok]', m.el).onclick = () => {
      if (!W) setup();
      const srcW = W / scale, srcH = H / scale;
      let OH = 1200, OW = 900;
      if (srcW < OW){ OW = Math.round(srcW); OH = Math.round(srcW * RH / RW); }
      const cv = document.createElement('canvas'); cv.width = OW; cv.height = OH;
      const ctx = cv.getContext('2d'); ctx.imageSmoothingQuality = 'high';
      if (!transparent){ ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, OW, OH); }
      ctx.drawImage(img, -x / scale, -y / scale, srcW, srcH, 0, 0, OW, OH);
      result = transparent ? cv.toDataURL('image/webp', .9) : cv.toDataURL('image/jpeg', .88);
      m.close();
    };
    // 모달이 그려진 뒤 크기를 재고, 혹시 0이면 한 번 더
    requestAnimationFrame(() => { setup(); if (!stage.clientWidth) setTimeout(setup, 60); });
  });
}

/* ---------- PNG ---------- */
function loadH2C(){
  if (window.html2canvas) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js'; s.onload = res; s.onerror = rej; document.head.append(s); });
}
async function capturePng(el, fileName, maxScale = 2){
  toast('이미지 만드는 중…', 8000);
  try { await loadH2C(); } catch { toast('PNG 모듈을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'); return false; }
  try {
    const w = el.offsetWidth, h = el.offsetHeight, scale = Math.min(maxScale, Math.sqrt(15e6 / (w * h)));
    const canvas = await html2canvas(el, { scale, useCORS: true, backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(),
      ignoreElements: n => n.classList && n.classList.contains('no-capture') });

    const b = e.target.closest('[data-s]'); if (!b) return;
    if (b.dataset.s === 'export') exportJson();
    if (b.dataset.s === 'import') importJson();
    if (b.dataset.s === 'reset' && confirm('정말 모든 자캐 데이터를 지울까요? 되돌릴 수 없어요.\n(먼저 백업을 권장해요)')){
      state = clone(DEFAULT); flush(); applyTheme(); m.close(); location.hash = '#/'; toast('모두 삭제했어요');
    }
  });
  if (navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then(est => { const u = $('#usage', m.el); if (u) u.textContent = `· 사용 중: ${fmtSize(est.usage || 0)}`; }).catch(() => {});
}

/* ---------- init ---------- */
(async function init(){
  try { await DB.open(); } catch (e){ console.warn('IndexedDB unavailable, using localStorage', e); DB.fallback = true; }
  try { state = normalizeState(await DB.get('state')); } catch (e){ console.error(e); state = clone(DEFAULT); }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  applyTheme(); route();
})();
</script>
</body>
</html>
